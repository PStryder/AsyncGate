name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: asyncgate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ASYNCGATE_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/asyncgate_test
      ASYNCGATE_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/asyncgate_test
      ASYNCGATE_ALLOW_INSECURE_DEV: "true"
      ASYNCGATE_API_KEY: "ci-test-key"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Dependency health
        run: python -m pip check

      - name: Migration smoke
        run: alembic upgrade head

      - name: Compile check
        run: python -m compileall -q src/asyncgate

      - name: Ruff (full repo)
        run: ruff check src/asyncgate --select E9,F63,F7,F82

      - name: Mypy (full repo)
        run: python -m mypy --config-file .mypy-ci.ini src/asyncgate

      - name: Run tests with coverage gate
        run: |
          pytest -q --maxfail=1 \
            --cov=asyncgate \
            --cov-report=term \
            --cov-fail-under=40

      - name: Docker build
        run: docker build -t asyncgate-ci .
