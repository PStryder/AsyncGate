name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: asyncgate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ASYNCGATE_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/asyncgate_test
      ASYNCGATE_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/asyncgate_test
      ASYNCGATE_ALLOW_INSECURE_DEV: "true"
      ASYNCGATE_API_KEY: "ci-test-key"
      # Canonical receipt schema, checked out below. Without this the receipt
      # contract tests skip instead of running.
      LEGIVELLUM_RECEIPT_SCHEMA: ${{ github.workspace }}/_legivellum/docs/canonical/receipt.schema.v1.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout LegiVellum (canonical receipt schema)
        uses: actions/checkout@v4
        with:
          repository: PStryder/LegiVellum
          path: _legivellum
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Canonical protocol package first. It is a hard dependency and is
          # not published to an index, so it comes from the sibling checkout.
          # Without it the receipt adapter cannot import, which is the point:
          # a gate that cannot validate receipts must fail, not degrade.
          python -m pip install -e ./_legivellum
          python -m pip install -e ".[dev]"

      - name: Dependency health
        run: python -m pip check

      - name: Migration smoke
        run: alembic upgrade head

      - name: Compile check
        run: python -m compileall -q src/asyncgate

      - name: Ruff (full repo)
        # The declared [tool.ruff.lint] selection, not a hand-picked subset.
        run: ruff check src/asyncgate

      - name: Mypy (full repo)
        # The declared [tool.mypy] config. The .mypy-ci.ini override that
        # disabled call-arg and attr-defined is deleted; those two codes
        # caught live crashes here and are guarded by a test.
        run: python -m mypy src/asyncgate

      - name: Run tests with coverage gate
        run: |
          pytest --asyncio-mode=auto -q --maxfail=1 \
            --cov=asyncgate \
            --cov-report=term \
            --cov-fail-under=40

      - name: Docker build
        # Build context is the parent of both checkouts so the image can
        # install the protocol package. `_legivellum` is the LegiVellum
        # checkout; lay it out as the Dockerfile expects.
        run: |
          mkdir -p _ctx/AsyncGate
          cp -r _legivellum _ctx/LegiVellum
          cp -r pyproject.toml README.md src alembic.ini alembic _ctx/AsyncGate/
          docker build -f Dockerfile -t asyncgate-ci _ctx

      # Phase 0 exit condition: canonical validation must work inside the
      # built image, with no checkout, mount, or sys.path help.
      - name: Container validation probe
        run: |
          docker run --rm -v "$PWD/_legivellum/problemata_demo:/probe:ro" asyncgate-ci python /probe/container_validation_probe.py
